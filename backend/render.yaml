services:
  - type: web
    name: clinicaliq-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: ENVIRONMENT
        value: production
    disk:
      name: chroma-db
      mountPath: /data/chroma_db
      sizeGB: 5

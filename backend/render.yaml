services:
  - type: web
    name: clinicaliq-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:10000 --timeout 120
    disk:
      name: chroma-db
      mountPath: /data/chroma_db
      sizeGB: 5
